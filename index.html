<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KitabSwap Build Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,650;9..144,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F5F8; --surface:#FFFFFF; --surface-2:#EDEFF4; --ink:#15171C; --ink-soft:#505665; --line:#D8DCE4;
  --gold:#D6970F; --gold-wash:#FCF1D7; --gold-ink:#6A4A00;
  --red:#B01F2D; --red-wash:#FBE7E9; --green:#21704B; --green-wash:#DEF0E6; --blue:#2847B5; --blue-wash:#E5EAFA;
  --code-bg:#171B27; --code-ink:#E8EBF4; --code-dim:#8790AD; --code-hi:#2A3352;
  --nav-bg:#15171C; --nav-ink:#E9EBF1; --nav-soft:#9BA2B4; --nav-line:#2C313D;
  --lr:#2847B5; --le:#D6970F; --ln:#21704B; --lm:#7A3FB0; --lr-w:#E5EAFA; --le-w:#FCF1D7; --ln-w:#DEF0E6; --lm-w:#F0E6F8;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10131A; --surface:#181C26; --surface-2:#212634; --ink:#E8EAF1; --ink-soft:#A3AABB; --line:#30364A;
    --gold:#F0B638; --gold-wash:#352A12; --gold-ink:#F6D58A;
    --red:#F07A84; --red-wash:#3A1D22; --green:#63C997; --green-wash:#163024; --blue:#8DA5FF; --blue-wash:#1E2848;
    --code-bg:#0B0E16; --code-hi:#232B47; --nav-bg:#0B0D13; --nav-line:#242938;
    --lr:#8DA5FF; --le:#F0B638; --ln:#63C997; --lm:#C9A2F0; --lr-w:#1E2848; --le-w:#352A12; --ln-w:#163024; --lm-w:#2C1F3B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10131A; --surface:#181C26; --surface-2:#212634; --ink:#E8EAF1; --ink-soft:#A3AABB; --line:#30364A;
  --gold:#F0B638; --gold-wash:#352A12; --gold-ink:#F6D58A;
  --red:#F07A84; --red-wash:#3A1D22; --green:#63C997; --green-wash:#163024; --blue:#8DA5FF; --blue-wash:#1E2848;
  --code-bg:#0B0E16; --code-hi:#232B47; --nav-bg:#0B0D13; --nav-line:#242938;
  --lr:#8DA5FF; --le:#F0B638; --ln:#63C997; --lm:#C9A2F0; --lr-w:#1E2848; --le-w:#352A12; --ln-w:#163024; --lm-w:#2C1F3B;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.55;font-size:15.5px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,'Times New Roman',serif;line-height:1.2;margin:0;font-weight:650}
code,pre,kbd,textarea.ed,.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
p{margin:0 0 .8em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
code{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:.86em}

/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--nav-bg);color:var(--nav-ink);padding:12px 20px;border-bottom:4px solid #E0A11C}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto}
.brand b{font-family:'Fraunces',Georgia,serif;font-size:1.25rem;font-weight:800}
.brand span{color:var(--nav-soft);font-size:.8rem}
.flag{display:inline-block;height:4px;width:46px;background:linear-gradient(90deg,#15171C 0 33%,#C8102E 33% 66%,#E0A11C 66%);border-radius:2px;outline:1px solid #3A4050;margin-top:6px}
.pill{border:1px solid var(--nav-line);border-radius:999px;padding:4px 12px;font-size:.8rem;color:var(--nav-ink);background:none}
.pill .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6B7180;margin-right:7px;vertical-align:1px}
.pill.on .dot{background:#63C997}
.top button.pill:hover{background:#242833}

/* stepper */
.stepper{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.stepper .grp{font-size:.74rem;font-weight:700;color:var(--ink-soft);margin:0 2px 0 10px}
.stepper .grp:first-child{margin-left:0}
.stepper button{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 5px;font-size:.84rem}
.stepper button .num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:.76rem}
.stepper button.done .num{background:var(--green);color:#fff}
.stepper button[aria-current="step"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.stepper button[aria-current="step"] .num{background:#E0A11C;color:#15171C}
.stepper button .lead{font-size:.7rem;background:var(--blue-wash);color:var(--blue);border-radius:999px;padding:0 6px;font-weight:700}

/* layout */
.layout{display:grid;grid-template-columns:minmax(340px,450px) minmax(0,1fr);gap:18px;padding:18px 20px 40px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card h3{font-size:1.02rem;margin-bottom:8px}
.guide h2{font-size:1.45rem;margin:2px 0 6px;font-weight:800;letter-spacing:-.01em}
.guide .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.82rem;color:var(--ink-soft);margin-bottom:8px}
.lay{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px 1px 3px;font-size:.78rem;font-weight:700}
.lay i{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.7rem}
.lay.R{background:var(--lr-w);color:var(--lr)} .lay.R i{background:var(--lr)}
.lay.E{background:var(--le-w);color:var(--gold-ink)} .lay.E i{background:var(--le);color:#15171C}
.lay.N{background:var(--ln-w);color:var(--ln)} .lay.N i{background:var(--ln)}
.lay.M{background:var(--lm-w);color:var(--lm)} .lay.M i{background:var(--lm)}
.intro{color:var(--ink-soft)}
.guide ul,.guide ol{padding-left:1.25em;margin:0 0 .8em}
.guide li{margin-bottom:.35em}
.guide ol li::marker{font-weight:700;color:var(--gold)}
.mern .why p:last-child,.mern .why ul:last-child,.mern .why ol:last-child{margin-bottom:0}
.mapwrap{background:var(--surface-2);border-radius:12px;padding:8px;margin:10px 0}
.mapwrap svg{display:block;width:100%;height:auto}
.m-panel{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.m-panel.on{stroke:var(--ink-soft);stroke-width:2}
.m-node rect{fill:var(--surface-2);stroke:var(--line);stroke-width:1.5;transition:fill .2s,stroke .2s}
.m-node.R rect{stroke:var(--lr)} .m-node.E rect{stroke:var(--le)} .m-node.M rect{stroke:var(--lm)}
.m-node.dim{opacity:.38}
.m-node.active rect{fill:var(--gold-wash);stroke:var(--gold);stroke-width:3.5}
.m-t{fill:var(--ink);font-family:'Atkinson Hyperlegible',sans-serif;font-size:12.5px}
.m-t.sm{font-size:10.5px}
.m-t.b{font-weight:700}
.m-t.s{fill:var(--ink-soft);font-size:11px}
.m-t.h{font-family:'Fraunces',serif;font-weight:800;font-size:12.5px}
.m-line{stroke:var(--ink-soft);stroke-width:1.6;fill:none}
.m-arrow{fill:var(--ink-soft)}
.narr{background:var(--gold-wash);border-radius:4px 12px 12px 12px;padding:10px 14px;min-height:64px;font-size:.93rem}
.narr .stp{display:block;font-size:.74rem;font-weight:700;color:var(--gold-ink);margin-bottom:2px}
.predict{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.predict b{display:block;margin-bottom:4px}
.reveal{background:var(--green-wash);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:.93rem}
.notes{font-size:.82rem;color:var(--ink-soft)}

/* buttons */
.btn{border:1.5px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 13px;font-size:.86rem;font-weight:700;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.gold{background:#E0A11C;border-color:#E0A11C;color:#15171C}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub{color:var(--ink-soft);font-size:.88rem}

/* checks */
.checks{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.checks li{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;font-size:.9rem;padding:7px 10px;border-radius:9px;background:var(--surface-2)}
.checks .mk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:.75rem;font-weight:700;color:var(--ink-soft);background:var(--surface)}
.checks li.ok{background:var(--green-wash)} .checks li.ok .mk{background:var(--green);border-color:var(--green);color:#fff}
.checks li.no{background:var(--red-wash)} .checks li.no .mk{background:var(--red);border-color:var(--red);color:#fff}
.checks li.run .mk{border-color:var(--gold);color:var(--gold)}
.checks .hint{display:block;font-size:.84rem;color:var(--ink-soft);margin-top:2px}
.complete{background:var(--green-wash);border-radius:10px;padding:10px 12px;margin-top:10px;font-weight:700}

/* hint */
.hintbox{background:var(--blue-wash);border-radius:4px 12px 12px 12px;padding:10px 14px;margin-top:10px;font-size:.93rem;white-space:pre-wrap}
.hintbox:empty{display:none}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
.toggle{display:flex;gap:9px;align-items:flex-start;font-size:.9rem;cursor:pointer;margin:4px 0}
.toggle input{width:18px;height:18px;accent-color:var(--blue);margin-top:2px;flex:none}

/* class board */
.board{display:grid;gap:5px;margin-top:8px;max-height:320px;overflow:auto}
.who{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;font-size:.86rem;padding:5px 8px;border-radius:8px;background:var(--surface-2)}
.who img{width:26px;height:26px;border-radius:50%}
.who.stuck{background:var(--red-wash)}
.who .st{font-size:.76rem;color:var(--ink-soft)}
.tag{font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--surface);border:1px solid var(--line)}
.tag.red{background:var(--red);color:#fff;border-color:var(--red)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--blue-wash);border:1.5px solid var(--blue);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:.92rem}
.banner[hidden]{display:none}

/* workspace */
.work{min-width:0}
.edhead{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.tabs{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.tabs button{border:0;background:none;padding:6px 12px;font-size:.82rem;font-family:'JetBrains Mono',monospace}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.tabs button .ch{display:inline-block;width:7px;height:7px;border-radius:50%;background:#E0A11C;margin-left:6px;vertical-align:1px}
.edhead .spacer{flex:1}
.edbox{display:grid;grid-template-columns:44px 1fr;background:var(--code-bg);border-radius:12px;overflow:hidden;height:380px;border:1px solid var(--code-bg)}
.gutter{color:var(--code-dim);font-family:'JetBrains Mono',monospace;font-size:.8rem;line-height:1.6;padding:12px 8px 12px 0;text-align:right;overflow:hidden;white-space:pre;user-select:none}
textarea.ed{width:100%;height:100%;resize:none;border:0;border-radius:0;background:var(--code-bg);color:var(--code-ink);font-size:.8rem;line-height:1.6;padding:12px 14px 12px 10px;white-space:pre;overflow:auto;tab-size:2;outline:none}
textarea.ed:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--gold)}
.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px}
.browser{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;min-height:360px}
.browser .bar{background:var(--surface-2);padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:.76rem;color:var(--ink-soft);display:flex;gap:6px;align-items:center}
.browser .bar i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.browser .bar .stat{margin-left:auto;font-family:'Atkinson Hyperlegible',sans-serif}
.browser iframe{border:0;width:100%;flex:1;min-height:330px;background:#F6F4EE}
.fatal{padding:14px;background:var(--red-wash);color:var(--ink);font-size:.9rem}
.fatal[hidden]{display:none}
.panel{border:1.5px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;min-height:360px;min-width:0}
.ptabs{display:flex;border-bottom:1px solid var(--line)}
.ptabs button{border:0;background:none;padding:8px 12px;font-size:.84rem;font-weight:700;color:var(--ink-soft);border-bottom:3px solid transparent}
.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:#E0A11C}
.ptabs .cnt{font-weight:400;font-size:.76rem;margin-left:4px}
.pbody{flex:1;overflow:auto;max-height:420px}
.log{font-family:'JetBrains Mono',monospace;font-size:.76rem;padding:8px 10px;display:grid;gap:3px}
.log .ln{display:grid;grid-template-columns:62px 1fr;gap:8px;white-space:pre-wrap;word-break:break-word;padding:2px 0;border-bottom:1px dashed var(--line)}
.log .src{font-size:.68rem;font-weight:700;border-radius:5px;padding:1px 5px;align-self:start;text-align:center}
.log .src.server{background:var(--ln-w);color:var(--ln)} .log .src.browser{background:var(--lr-w);color:var(--lr)} .log .src.studio{background:var(--surface-2);color:var(--ink-soft)}
.log .warn{color:var(--gold-ink)} .log .error{color:var(--red)}
.empty{color:var(--ink-soft);font-size:.86rem;padding:12px}
.net{display:grid;gap:4px;padding:8px 10px}
.net details{border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.net summary{display:grid;grid-template-columns:52px 1fr auto auto;gap:8px;align-items:center;padding:5px 8px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.76rem}
.net summary small{font-family:'Atkinson Hyperlegible',sans-serif;color:var(--ink-soft)}
.net pre{margin:0;padding:6px 10px 8px;font-size:.74rem;white-space:pre-wrap;word-break:break-word;border-top:1px solid var(--line)}
.code{display:inline-block;border-radius:6px;padding:0 7px;font-weight:700;font-family:'JetBrains Mono',monospace;font-size:.74rem}
.c2{background:var(--green-wash);color:var(--green)} .c4{background:var(--gold-wash);color:var(--gold-ink)} .c5,.c0{background:var(--red-wash);color:var(--red)}
.tester{padding:10px;display:grid;gap:8px}
.tester .req{display:grid;grid-template-columns:auto 1fr auto;gap:6px}
.tester textarea{font-family:'JetBrains Mono',monospace;font-size:.78rem;min-height:70px;resize:vertical}
.tester .resp{background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:8px 10px;font-family:'JetBrains Mono',monospace;font-size:.76rem;white-space:pre-wrap;word-break:break-word;min-height:90px;max-height:230px;overflow:auto}
.presets{display:flex;gap:5px;flex-wrap:wrap}
.presets button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:2px 9px;font-size:.74rem;font-family:'JetBrains Mono',monospace}
.foot{padding:0 20px 30px;color:var(--ink-soft);font-size:.8rem}

@media (max-width: 1150px){ .layout{grid-template-columns:1fr} }
@media (max-width: 760px){
  .lower{grid-template-columns:1fr}
  .top,.stepper,.layout{padding-left:12px;padding-right:12px}
  .edbox{height:320px}
  .tester .req{grid-template-columns:1fr}
}
@media print{ .work,.stepper{display:none} .layout{display:block} }

</style>
</head>

    const id = ++reqSeq; const t = setTimeout(() => { delete pending[id]; res({ timeout: true }); }, ms);
    pending[id] = d => { clearTimeout(t); res(d); };
    frame.contentWindow.postMessage(Object.assign({ __studio: RUN.id, id }, msg), '*');
  });
}
async function apiCall(method, url, body) {
  const r = await sbx({ t: 'req', method, url, body: body == null ? null : typeof body === 'string' ? body : JSON.stringify(body) });
  let json = null; try { json = JSON.parse(r.body); } catch (e) {}
  return Object.assign(r, { json });
}

/* ===================== checks ===================== */
async function runChecks(st, onProgress) {
  const res = st.checks.map(() => null);
  run();
  const ok = await waitReady();
  if (!ok) return res.map(() => false);
  await wait(350);
  let mt = null;
  const parse = () => new DOMParser().parseFromString('<body>' + RUN.html + '</body>', 'text/html');
  const x = {
    state: RUN, src: k => filesFor(S.step)[k], wait,
    api: apiCall,
    modeltest: async () => { if (!mt) { const r = await sbx({ t: 'probe', kind: 'modeltest' }); mt = r.result || {}; } return mt; },
    until: async (fn, ms = 3000) => { const t0 = Date.now(); while (Date.now() - t0 < ms) { try { if (fn(parse())) return true; } catch (e) {} await wait(150); } try { return !!fn(parse()); } catch (e) { return false; } },
    click: async (text, index) => { const r = await sbx({ t: 'probe', kind: 'click', text, index: index || 0 }); await wait(80); return r.ok; },
    fill: async (selector, value) => { const r = await sbx({ t: 'probe', kind: 'fill', selector, value }); await wait(40); return r.ok; }
  };
  for (let i = 0; i < st.checks.length; i++) {
    res[i] = 'run'; onProgress(res.slice());
    let v = false;
    try { v = !!(await Promise.race([st.checks[i].run(x), wait(12000).then(() => false)])); } catch (e) { v = false; }
    res[i] = v; onProgress(res.slice());
  }
  return res;
}

  const prompt = `You are a friendly teaching assistant for BINF 602 Electronic Business Development at the German International University. A student is building KitabSwap, a one-page MERN app (second-hand textbooks), in a browser studio. React 18 runs for real; Express 5 and Mongoose are simulated faithfully in the browser.

${question ? 'The student asks: ' + question : ''}

--- server.js ---
${trim(f.server)}
--- models/Book.js ---
${trim(f.model)}
--- src/App.jsx ---
${trim(f.app)}`;
  const render = t => { out.innerHTML = esc(t).replace(/`([^`\n]+)`/g, '<code>$1</code>'); };
  try {
